<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClusterFlux Projects</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://homepage.theclusterflux.com/">
    <meta property="og:title" content="ClusterFlux Projects">
    <meta property="og:description" content="A showcase of innovative projects built by TheClusterFlux community. Explore our collection of web applications, tools, and creative solutions.">
    <meta property="og:image" content="https://homepage.theclusterflux.com/logo.png">
    <meta property="og:site_name" content="ClusterFlux">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://homepage.theclusterflux.com/">
    <meta property="twitter:title" content="ClusterFlux Projects">
    <meta property="twitter:description" content="A showcase of innovative projects built by TheClusterFlux community. Explore our collection of web applications, tools, and creative solutions.">
    <meta property="twitter:image" content="https://homepage.theclusterflux.com/logo.png">
    
    <!-- Additional meta tags -->
    <meta name="description" content="A showcase of innovative projects built by TheClusterFlux community. Explore our collection of web applications, tools, and creative solutions.">
    <meta name="keywords" content="ClusterFlux, projects, web development, open source, community">
    <meta name="author" content="TheClusterFlux">
    
    <link rel="stylesheet" href="style-guilty-crown.css">
    <link rel="stylesheet" href="/shared/theme-switcher.css">
    <link rel="stylesheet" href="/shared/theme-pulse-life.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <script src="/shared/thumb-preload.js"></script>
    <script src="/shared/cluster-pulse.js"></script>
    <script src="/shared/theme-pulse-life.js"></script>
    <script src="/shared/theme-registry.js"></script>
    <script src="/shared/theme-landing.js"></script>
</head>
<body data-visual-theme="guilty-crown">

<header class="header">
  <div class="header-content">
    <div class="header-brand">
      <img src="logo.svg" alt="ClusterFlux" class="site-logo">
      <h1 class="site-title">ClusterFlux Projects</h1>
    </div>
    
    <div class="header-controls">
      <div class="search-filter-container">
        <div class="search-container">
          <i class="fas fa-search search-icon"></i>
          <input
            type="text"
            id="search-bar"
            class="search-bar"
            placeholder="Search projects by title or tech..."
          />
        </div>
        
        <div id="category-filter-container" class="filter-container">
          <label for="category-filter"><i class="fas fa-folder"></i> Category:</label>
          <select id="category-filter">
            <option value="all">All</option>
            <option value="games">Games</option>
            <option value="tools">Tools</option>
            <option value="infrastructure">Infrastructure</option>
          </select>
        </div>
      </div>
      
      <div class="header-buttons">
        <a href="/cv" class="action-button cv-button" title="View CV">
          <i class="fas fa-file-alt"></i>
          <span>CV</span>
        </a>
        <button id="theme-toggle" class="action-button" title="Toggle Dark Mode">
          <i class="fas fa-moon" id="theme-icon"></i>
          <span id="theme-text">Dark</span>
        </button>
        <button id="about-button" class="action-button about-button" title="About Us">
          <i class="fas fa-info-circle"></i>
          <span>About</span>
        </button>
        <a href="https://github.com/TheClusterFlux" target="_blank" class="action-button github-button" title="GitHub">
          <i class="fab fa-github"></i>
          <span>GitHub</span>
        </a>
      </div>
    </div>
  </div>
</header>

<!-- Highlighted row: one project per category (Games / Tools / Infrastructure) -->
<div id="highlighted-section" class="highlighted-section" style="display: none;">
  <h2 class="highlighted-section-title">
    <i class="fas fa-star"></i> Highlighted
  </h2>
  <div id="highlighted-row" class="highlighted-row"></div>
</div>

<div id="all-projects-section">
  <h2 class="all-projects-title">All Projects</h2>
  <div id="projects" class="projects-grid"></div>
</div>

<script>
  // Dynamically determine base URL based on environment
  const baseURL = '';  // Use empty string for relative URLs
  window.CLUSTER_THUMB_BASE = `${baseURL}/thumbnails/`;

  const VALID_CATEGORIES = ['games', 'tools', 'infrastructure'];

  function getCategory(project) {
    const c = (project.category || 'tools').toLowerCase();
    return VALID_CATEGORIES.includes(c) ? c : 'tools';
  }

  function getCategoryLabel(category) {
    return category.charAt(0).toUpperCase() + category.slice(1);
  }

  function applyFilters() {
    const selectedCategory = document.getElementById('category-filter').value;
    const searchTerm = document.getElementById('search-bar').value.toLowerCase();
    const projectCards = document.querySelectorAll('#projects .card');

    projectCards.forEach(card => {
      const category = card.getAttribute('data-category') || 'tools';
      const title = card.querySelector('h5').textContent.toLowerCase();
      const tech = card.querySelector('.tech-list').textContent.toLowerCase();

      const matchCategory = selectedCategory === 'all' || category === selectedCategory;
      const matchSearch = !searchTerm || title.includes(searchTerm) || tech.includes(searchTerm);

      card.style.display = matchCategory && matchSearch ? 'block' : 'none';
    });
  }

  document.getElementById('category-filter').addEventListener('change', applyFilters);

  function getVisitUrl(links) {
    if (!links || typeof links !== 'object') return null;
    const key = Object.keys(links).find(k =>
      ['visit', 'website', 'demo'].includes(k.toLowerCase()));
    return key ? links[key] : null;
  }

  // Helper function to create a project card HTML
  function createProjectCard(project, options) {
    options = options || {};
    const category = getCategory(project);
    const categoryLabel = getCategoryLabel(category);
    const hasImage = project.image && project.image.trim() !== '';
    const imageElement = hasImage 
      ? `<img src="${baseURL}/thumbnails/${project.image}" alt="${project.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">`
      : '';
    const constructionIcon = hasImage 
      ? `<div class="construction-placeholder" style="display: none;">
           <i class="fas fa-tools"></i>
           <span>Card Under Construction</span>
         </div>`
      : `<div class="construction-placeholder">
           <i class="fas fa-tools"></i>
           <span>Card Under Construction</span>
         </div>`;
    const featuredLabel = options.isHighlighted ? '<span class="card-featured-label">Featured</span>' : '';
    const visitUrl = getVisitUrl(project.links);
    const visitLinkHtml = visitUrl
      ? `<div class="project-links"><a href="${visitUrl}" class="btn btn-visit" target="_blank" rel="noopener noreferrer">Visit</a></div>`
      : '';

    return `
      <div class="card" data-category="${category}">
        ${featuredLabel}
        <span class="category-badge category-badge-${category}">${categoryLabel}</span>
        ${imageElement}
        ${constructionIcon}
        <div class="card-body">
          <h5>${project.title}</h5>
          <p>${project.description}</p>
          <div class="tech-list">Tech: ${project.tech}</div>
          ${visitLinkHtml}
        </div>
      </div>
    `;
  }

  function projectSort(a, b) {
    const aHasVisitLink = Object.keys(a.links || {}).some(key =>
      key.toLowerCase() === 'visit' || key.toLowerCase() === 'website' || key.toLowerCase() === 'demo');
    const bHasVisitLink = Object.keys(b.links || {}).some(key =>
      key.toLowerCase() === 'visit' || key.toLowerCase() === 'website' || key.toLowerCase() === 'demo');
    if (aHasVisitLink && !bHasVisitLink) return -1;
    if (!aHasVisitLink && bHasVisitLink) return 1;
    return a.title.localeCompare(b.title);
  }

  function fetchProjects() {
    fetch(`${baseURL}/data/projects.json`)
      .then(response => response.json())
      .then(projects => {
        // Normalize category (fallback for legacy projects)
        projects.forEach(p => {
          if (!p.category || !VALID_CATEGORIES.includes((p.category || '').toLowerCase())) {
            p.category = 'tools';
          } else {
            p.category = p.category.toLowerCase();
          }
        });

        const featuredProjects = projects.filter(p => p.featured === true || p.featured === 'true');
        const categoryOrder = ['games', 'tools', 'infrastructure'];
        featuredProjects.sort((a, b) => {
          const ai = categoryOrder.indexOf(getCategory(a));
          const bi = categoryOrder.indexOf(getCategory(b));
          if (ai !== bi) return ai - bi;
          return projectSort(a, b);
        });

        const highlightedSection = document.getElementById('highlighted-section');
        const highlightedRow = document.getElementById('highlighted-row');

        if (featuredProjects.length > 0) {
          highlightedSection.style.display = 'block';
          highlightedRow.innerHTML = '';
          featuredProjects.forEach(project => {
            const slot = document.createElement('div');
            slot.className = 'highlighted-slot';
            slot.innerHTML = createProjectCard(project, { isHighlighted: true });
            highlightedRow.appendChild(slot);
          });
        } else {
          highlightedSection.style.display = 'none';
        }

        // All projects grid (with category badge and data-category)
        const allProjects = [...projects];
        allProjects.sort(projectSort);
        const container = document.getElementById('projects');
        container.innerHTML = '';
        allProjects.forEach(project => {
          container.innerHTML += createProjectCard(project);
        });

        applyFilters();
      })
      .catch(error => console.error('Error fetching projects:', error));
  }

  // Dark Mode Toggle
  const themeToggle = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('theme-icon');
  const themeText = document.getElementById('theme-text');
  
  // Function to get system preference
  function getSystemTheme() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  
  // Function to get initial theme (saved preference or system preference)
  function getInitialTheme() {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
      return savedTheme; // User has manually set a preference
    }
    return getSystemTheme(); // Use system preference
  }
  
  // Set initial theme
  const currentTheme = getInitialTheme();
  document.documentElement.setAttribute('data-theme', currentTheme);
  updateThemeIcon(currentTheme);
  
  function updateThemeIcon(theme) {
    if (theme === 'dark') {
      themeIcon.classList.remove('fa-moon');
      themeIcon.classList.add('fa-sun');
      themeText.textContent = 'Light';
    } else {
      themeIcon.classList.remove('fa-sun');
      themeIcon.classList.add('fa-moon');
      themeText.textContent = 'Dark';
    }
  }
  
  themeToggle.addEventListener('click', () => {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme); // Save manual preference
    updateThemeIcon(newTheme);
  });
  
  // Listen for system theme changes (only if user hasn't manually set a preference)
  if (window.matchMedia) {
    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
    mediaQuery.addEventListener('change', (e) => {
      // Only update if user hasn't manually set a preference
      if (!localStorage.getItem('theme')) {
        const newTheme = e.matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        updateThemeIcon(newTheme);
      }
    });
  }

  // Initialize the page
  fetchProjects();

  document.getElementById('search-bar').addEventListener('input', applyFilters);

  // Navigate to About page
  document.getElementById('about-button').addEventListener('click', () => {
    window.location.href = '/about.html';
  });

</script>
<script src="/shared/theme-switcher.js"></script>

</body>
</html>
