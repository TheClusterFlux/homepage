<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClusterFlux — Seraph Static</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/reset.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="/shared/theme-switcher.css">
  <link rel="stylesheet" href="/shared/theme-pulse-life.css">
</head>
<body data-visual-theme="seraph-static">
  <div class="vhs-room" aria-hidden="true">
    <div class="vhs-room__glow"></div>
    <div class="vhs-room__stack"></div>
  </div>

  <div class="receiver">
    <header class="receiver__top">
      <div class="receiver__brand">
        <img src="/shared/logo.svg" alt="" width="32" height="32">
        <div>
          <p class="receiver__kicker">Void Genome · UHF Stack</p>
          <h1 class="receiver__title">Seraph Static</h1>
        </div>
      </div>
      <div class="receiver__tuner-meta">
        <span class="tuner-led tuner-led--live" aria-hidden="true"></span>
        <span id="signal-label">SIGNAL: SEARCHING</span>
        <span id="clock-label" aria-hidden="true">--:--:--</span>
      </div>
      <div class="receiver__filters">
        <label class="rx-field">
          <span class="rx-field__label">Scan</span>
          <input type="search" id="search-bar" placeholder="Title or tech…" autocomplete="off" aria-label="Search projects">
        </label>
        <label class="rx-field rx-field--select">
          <span class="rx-field__label">Band</span>
          <select id="category-filter" aria-label="Category">
            <option value="all">All bands</option>
            <option value="games">Games</option>
            <option value="tools">Tools</option>
            <option value="infrastructure">Infrastructure</option>
          </select>
        </label>
      </div>
    </header>

    <section id="featured-section" class="preset-strip" hidden aria-labelledby="preset-heading">
      <div class="preset-strip__head">
        <h2 id="preset-heading">Preset memory</h2>
        <span class="preset-strip__tag">FEATURED</span>
      </div>
      <div id="featured-row" class="preset-strip__tape" role="list"></div>
    </section>

    <div class="crt-unit">
      <aside class="channel-sidebar" aria-label="Channel list">
        <div class="channel-sidebar__head">
          <span>CH</span>
          <span>BAND</span>
        </div>
        <ol id="channel-list" class="channel-sidebar__list"></ol>
      </aside>

      <div class="crt-bezel">
        <div class="crt-bezel__label">SERAPH-VHS / MK-IV</div>
        <div class="crt-glass" id="crt-glass">
          <canvas id="static-canvas" class="crt-static" aria-hidden="true"></canvas>
          <div class="crt-scanlines" aria-hidden="true"></div>
          <div class="crt-vignette" aria-hidden="true"></div>
          <div class="crt-tracking" aria-hidden="true"></div>

          <article id="tuner-view" class="tuner-view" aria-live="polite">
            <div class="tuner-view__idle" id="tuner-idle">
              <p class="tuner-view__snow">▒▒▒ NO CARRIER ▒▒▒</p>
              <p class="tuner-view__hint">Select a channel or use ↑ ↓ to tune.</p>
            </div>
            <div class="tuner-view__program" id="tuner-program" hidden></div>
          </article>
        </div>
        <div class="crt-controls" aria-hidden="true">
          <span class="crt-knob"></span>
          <span class="crt-knob crt-knob--small"></span>
          <span class="crt-slot">TAPE IN</span>
        </div>
      </div>
    </div>

    <p id="empty-state" class="empty-hum" hidden>No channels match this band.</p>

    <footer class="receiver__foot">
      <a href="https://github.com/TheClusterFlux" target="_blank" rel="noopener noreferrer">GitHub</a>
    </footer>
  </div>

  <script src="/shared/thumb-preload.js"></script>
  <script src="/shared/theme-registry.js"></script>
  <script src="/shared/theme-landing.js"></script>
  <script src="/shared/cluster-pulse.js"></script>
  <script src="/shared/theme-pulse-life.js"></script>
  <script src="/shared/theme-switcher.js"></script>
  <script src="app.js"></script>
</body>
</html>
